<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - هيئة استثمار البصرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3c72; /* أزرق داكن رسمي */
            --secondary: #27ae60; /* أخضر لزر الإكسل */
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #eaeff5;
        }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 30px 15px; 
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-card h2 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-card h2::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 25px;
            background-color: var(--primary);
            border-radius: 5px;
        }
        .export-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
        }
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.4);
        }
        .table-wrapper {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }
        thead {
            background-color: #f8fafc;
            border-bottom: 2px solid var(--border);
        }
        th {
            padding: 18px 20px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 14px;
        }
        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-size: 15px;
        }
        tbody tr {
            transition: background 0.2s ease;
        }
        tbody tr:hover {
            background-color: #fcfcfd;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-card">
            <h2>سجل الموارد البشرية</h2>
            <button class="export-btn" onclick="exportExcel()">⬇ تصدير إلى Excel</button>
        </div>

        <div class="table-wrapper">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>الاسم الثلاثي</th>
                        <th>رقم الهاتف</th>
                        <th>السكن</th>
                        <th>المواليد</th>
                        <th>الاختصاص</th>
                        <th>الخبرات</th>
                        <th>النبذة</th>
                        <th>وقت التسجيل</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" class="empty-message">جاري جلب البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ضع إعدادات Firebase الخاصة بك هنا
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        db.ref('registrations').on('value', snapshot => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 
            
            if (!snapshot.exists()) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-message">لا توجد تسجيلات حتى الآن.</td></tr>';
                return;
            }

            snapshot.forEach(child => {
                let d = child.val();
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${d.fullName}</strong></td>
                        <td dir="ltr" style="text-align: right;">${d.phone}</td>
                        <td>${d.address}</td>
                        <td>${d.dob}</td>
                        <td>${d.specialty}</td>
                        <td>${d.experience}</td>
                        <td>${d.bio}</td>
                        <td style="color: #7f8c8d; font-size: 13px;">${d.timestamp}</td>
                    </tr>
                `;
            });
        });

        function exportExcel() {
            let table = document.getElementById("dataTable");
            let wb = XLSX.utils.table_to_book(table, {sheet: "المسجلين"});
            XLSX.writeFile(wb, "سجل_هيئة_استثمار_البصرة.xlsx");
        }
    </script>
</body>
</html>
